# game_art 示例配置。复制到 ~/.game_art/config.yaml 后按需修改。
# 密钥和接口地址写在同目录的 .env 文件里（或设置同名环境变量）：
#   COMFYUI_LLM_BASE_KEY=sk-...
#   COMFYUI_LLM_BASE_URL=https://aihubmix.com/v1
# 这里只写变量名；.env 没写 COMFYUI_LLM_BASE_URL 时回退到下面的 base_url。
providers:
  aihubmix:
    type: openai_compatible
    base_url_env: COMFYUI_LLM_BASE_URL
    base_url: https://aihubmix.com/v1
    api_key_env: COMFYUI_LLM_BASE_KEY
    # aihubmix 的 /v1/models 不列出 gpt-image-1，但 /v1/images/generations 实际支持（2026-11 实测）
    # gpt-image-2 / 2.5-sunburst / 2.6-sunburst 同样不在列表里，改图接口实测可用（2026-11）
    unlisted_models: [gpt-image-1, gpt-image-2, gpt-image-2.5-sunburst, gpt-image-2.6-sunburst]
    # 这些模型走 Gemini 原生出图接口（它们不认 OpenAI 的 /images/generations）。支持通配符。
    # 尺寸会换算成最接近的宽高比（1536x1024 → 3:2）；不支持透明背景和遮罩局部重绘。
    gemini_image_models: ["gemini-*"]
    timeout: 120

  # 本机模型服务示例（Ollama、LM Studio 等提供 OpenAI 兼容接口的都可以）。
  # 取消注释后刷新 ComfyUI 页面，节点的模型下拉里就会出现 local:qwen2.5:14b。
  # 本机服务只能用于文字类节点（扩写、看图、质检）；本机出图要用 ComfyUI 自带的采样节点另搭工作流。
  # local:
  #   type: openai_compatible
  #   base_url: http://127.0.0.1:11434/v1
  #   models: ["qwen2.5:14b"]          # 出现在节点下拉里的模型名；不需要密钥时不写 api_key_env

# 节点上的"模型"下拉 = 下面的 profile 名 + profiles 里出现过的 provider:model + 各 provider 的 models。
# 再加上各 provider 的 /models 接口列出的全部模型（自动获取，每小时更新，缓存在 data_dir/models_cache.json）。
# /models 没列出但实际能用的模型（常见于出图模型），写进该 provider 的 unlisted_models 或 models 就会出现在下拉里。
# profile -> 目标列表（按顺序尝试，失败自动切换到下一个）
# 模型名需用 GET /v1/models 核对当前可用性。
profiles:
  text:
    - aihubmix:gpt-4o-mini
  vision:
    - aihubmix:gpt-4o
  # 出图目标用对象写法固定 quality：上游按质档计费，不固定的话默认质档可能更贵，
  # 下面 per_image 的估价就对不上。改质档/尺寸时请同步改 pricing。
  image:
    - {provider: aihubmix, model: gpt-image-2.6-sunburst, params: {quality: medium}}
    - {provider: aihubmix, model: gpt-image-1, params: {quality: medium}}   # 上一个不可用时自动换这个
  image_edit:
    - {provider: aihubmix, model: gpt-image-2.6-sunburst, params: {quality: medium}}
    - {provider: aihubmix, model: gpt-image-1, params: {quality: medium}}   # 上一个不可用时自动换这个

# 估算价格（美元），键为 "provider:model"。只是按配置估算，请以服务商账单为准。
# 若上游响应带 usage，token 数也会记入账本（配置了 per_1k_* 才会计入费用）。
pricing:
  "aihubmix:gpt-image-1":
    per_image: 0.04   # 约等于 quality=medium、1024x1024 的单张价
  # 这个模型实际按 token 计费（OpenAI 官方价：图片输入 $8、图片输出 $30 每百万 token，2026-11 查得），
  # 这里折成单张的估价：1024x1024 中等画质约 0.04，加上参考图的输入约 0.01。高画质、多张参考图时会更贵。
  "aihubmix:gpt-image-2.6-sunburst":
    per_image: 0.05
  "aihubmix:gpt-4o-mini":
    per_1k_input_tokens: 0.00015
    per_1k_output_tokens: 0.0006
  "aihubmix:gpt-4o":
    per_1k_input_tokens: 0.0025
    per_1k_output_tokens: 0.01

comfy_url: http://127.0.0.1:8188
# ComfyUI 的安装目录（里面有 custom_nodes/ 和 main.py 的那一层），必须改成你自己机器上的路径
comfy_root: ~/Documents/ComfyUI
data_dir: ~/.game_art
max_retries: 2

# 节点"尺寸"下拉里的选项（宽x高）。下面是 gpt-image-1 支持的全部尺寸；换出图模型时按它支持的尺寸改。
image_sizes: ["1024x1024", "1536x1024", "1024x1536"]
