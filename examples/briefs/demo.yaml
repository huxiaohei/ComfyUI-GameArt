# 描述清单示例：《三国守御录》的五张标准风格图（四个人物加一座建筑）。
# 用法：在 ComfyUI 里把这个文件拖到「提示词扩写」节点上（或把路径填进 briefs_path），
# 然后点 item 选一项，它的描述会填进 brief。照这些描述出的图就是 examples/refs/ 里的那五张。
#
# 字段：
#   asset_type  可选，整份清单默认的素材种类（icon / prop / character / ui_element / background / illustration）
#   prefix      可选，每条描述前面都加的公共文字，适合写每一项都一样的要求
#   items       必填，每项一个 id（会用作保存的文件名）和一段 brief（大白话描述）；某一项可以单独写 asset_type
#
# 这几条描述的写法：先写构图和留白，再写这套画风的固定画法（头身比、眼睛、线条、上色），最后写这一张特有的内容。
# 第一张（warrior）不带参考图出；其余几张把 warrior 作为参考图，所以开头有一句"参考图只用来……"。
asset_type: character
items:
  - id: warrior
    brief: 无名的年轻男性武将，Q版全身立像。人物小小地站在画面正中，从头顶到脚底只占画面高度的七成，头顶上方和脚下都留有大片空白，黑色布靴完整可见，双脚踩在同一条水平线上，脚底下方是干净平整的空白背景。背景是一整片干净的纯色，人物的外轮廓线直接和背景相接。2.5头身，头的高度约占全身四成。大而圆的眼睛，深褐色瞳仁上深下浅，瞳仁里两个白色高光点，上眼线是一道粗的深褐色弧线，鼻子是一个小点，嘴是一道短弧线。全身用深褐色线条勾边，外轮廓线粗、内部线条细一半；每块颜色只分亮面和暗面两层平涂，色块干净平整。天蓝色束袖战袍，胸前和双肩是银白色札甲，甲片只用三四道横线示意，金属部分也是两层平涂加一小块高光；腰间系深蓝色宽腰带。头发束成发髻，戴一顶银色小冠。没有胡须，粗眉，眉目清朗，表情平和自信。双手空着，自然垂在身体两侧，手里不拿任何东西，身上不带兵器。端正的正面站姿。主色天蓝，辅色银白。
  - id: lady
    brief: 参考图只用来统一线条、上色方式、五官画法和头身比例，人物身份、服装和姿势全部按下面的文字重新设计，不要沿用参考图里的人物。无名的年轻女子，Q版全身立像。人物小小地站在画面正中，从头顶到脚底只占画面高度的七成，头顶上方和脚下都留有大片空白，绣花鞋完整可见，双脚踩在同一条水平线上，脚底下方是干净平整的空白背景。背景是一整片干净的纯色，人物的外轮廓线直接和背景相接。2.5头身，头的高度约占全身四成。大而圆的眼睛，深褐色瞳仁上深下浅，瞳仁里两个白色高光点，上眼线是一道粗的深褐色弧线，鼻子是一个小点，嘴是一道短弧线。全身用深褐色线条勾边，外轮廓线粗、内部线条细一半；每块颜色只分亮面和暗面两层平涂，色块干净平整。橙红色的交领襦裙，裙身是整块的颜色，只在裙摆有一道简单的米白色镶边；肩上搭一条米白色披帛，披帛是不透明的布料，用和衣服一样的线条和平涂来画，垂在身体两侧、长度不过膝。双环髻上插一支木簪。细眉，圆脸，笑容开朗。双手空着，在身前轻轻交叠，手里不拿任何东西。端正的正面站姿。主色橙红，辅色米白。
  - id: elder
    brief: 参考图只用来统一线条、上色方式、五官画法和头身比例，人物身份、服装和姿势全部按下面的文字重新设计，不要沿用参考图里的人物。无名的年长文官，Q版全身立像。人物小小地站在画面正中，从头顶到脚底只占画面高度的七成，头顶上方和脚下都留有大片空白，黑色布履完整可见，双脚踩在同一条水平线上，脚底下方是干净平整的空白背景。背景是一整片干净的纯色，人物的外轮廓线直接和背景相接。2.5头身，头的高度约占全身四成。大而圆的眼睛，深褐色瞳仁上深下浅，瞳仁里两个白色高光点，上眼线是一道粗的深褐色弧线，鼻子是一个小点，嘴是一道短弧线。全身用深褐色线条勾边，外轮廓线粗、内部线条细一半；每块颜色只分亮面和暗面两层平涂，色块干净平整。深青色的宽袖交领长袍，领口和袖口是一道白色镶边，腰间系黑色腰带。头戴黑色进贤冠。垂到胸口的灰白色长须和灰白色眉毛，胡须画成一整块颜色，只用几道线表示走向；眼睛的画法和年轻人一样，眼角加一两道短纹表示年纪，神情沉稳和善。双手拢在袖中放在身前，手里不拿任何东西。端正的正面站姿。主色深青，辅色白。
  - id: soldier
    brief: 参考图只用来统一线条、上色方式、五官画法和头身比例，人物身份、服装和姿势全部按下面的文字重新设计，不要沿用参考图里的人物。无名的普通士兵，Q版全身立像，个子比武将矮小一些。人物小小地站在画面正中，从头顶到脚底只占画面高度的七成，头顶上方和脚下都留有大片空白，麻布鞋完整可见，双脚踩在同一条水平线上，脚底下方是干净平整的空白背景。背景是一整片干净的纯色，人物的外轮廓线直接和背景相接。2.5头身，头的高度约占全身四成。大而圆的眼睛，深褐色瞳仁上深下浅，瞳仁里两个白色高光点，上眼线是一道粗的深褐色弧线，鼻子是一个小点，嘴是一道短弧线。全身用深褐色线条勾边，外轮廓线粗、内部线条细一半；每块颜色只分亮面和暗面两层平涂，色块干净平整。头发束成发髻，头上裹一条深红色头巾，在脑后打结；身穿交领右衽的深红色粗布短袍，袖口收紧，外面罩一件只护住胸背的褐色皮甲，甲片用两三道横线示意；腰间系宽布腰带，下身是宽松的束脚裤，小腿缠着布绑腿。粗眉，表情憨厚。双手空着叉在腰上，手里不拿任何东西，身上不带兵器。正面略偏右的站姿。全身只有三到四个大色块，没有花纹和饰件。主色深红，辅色皮革褐。
  - id: granary
    brief: 参考图只用来统一线条和上色方式，画的内容全部按下面的文字来，画面里不要出现人物。一座小粮仓，单个建筑，小小地立在画面正中，只占画面高度的七成，四周都留有大片空白，背景是一整片干净的纯色，建筑的外轮廓线直接和背景相接。圆筒形的夯土墙，圆锥形的茅草屋顶，一扇小木门，门边靠着两个鼓鼓的粮袋。结构简化成几个大块面，茅草和木纹只用少量线条示意。全部用深褐色线条勾边，外轮廓线粗、内部线条细一半；每块颜色只分亮面和暗面两层平涂。俯视3/4视角。主色土黄，辅色草黄。
    asset_type: prop
