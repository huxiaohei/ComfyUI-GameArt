name: 国潮插画风
description: 融合传统东方美学的现代插画风格，平涂配色加描金线条，装饰感强，适合节日活动与道具图标。
palette:
  - "#C8372D"   # 朱红
  - "#2F5D8A"   # 石青
  - "#D4A93C"   # 金
  - "#F4EBD9"   # 米白
  - "#1E1B18"   # 墨黑
positive: 国潮插画, 平涂上色, 描金线条, 祥云回纹装饰, 东方传统纹样, 干净利落的轮廓
negative: 写实光影, 照片质感, 3D渲染, 模糊, 文字, 水印, 霓虹赛博风
rules:
  - 平涂+描金线条，色块之间用细金线勾边
  - 以祥云、回纹作为主要装饰母题
  - 不要写实光影，不要复杂渐变和体积光
  - 配色严格取自色板，金色只用于描边与点缀
