# 风格卡示例：三国题材塔防游戏《三国守御录》的日系 Q 版画风（实际项目在用的那一份）。
# 用法：把这个文件拖到「风格卡」节点上，或在节点的 path 里填 @repo/examples/style_cards/sanguo_chibi.yaml。
# 配套的标准风格图在 examples/refs/，描述清单在 examples/briefs/demo.yaml。
#
# 写风格卡的几条经验：
# - positive 会原样拼到提示词末尾，不会被扩写压缩，每张图都必须遵守的硬性要求写在那里。
# - rules 写成能逐条对照检查的具体标准（线条多粗、明暗几层、眼睛怎么画），质检也会按它来挑问题。
#   "干净""通透"这类宽泛的说法，模型每次理解都不一样，画风就会跑偏。
# - 画面里不想要的东西，尽量写成"应该是什么样"；提到的词模型容易照着画出来。
name: 三国守御录 · 日系Q版
description: 三国题材塔防游戏的日系Q版卡通画风。造型圆润可爱，2.5头身，深褐色线稿、外轮廓粗内线细，两层明暗的平涂，色块干净，配色明亮通透；所有角色的线条、上色方式、五官画法和头身比例完全一致，像出自同一位画师之手。小尺寸下也能一眼认出，整体现代清爽，不要复古厚重感。
palette:
- '#3A2B2E'
- '#FFF6E6'
- '#F6B93B'
positive: 日系Q版卡通, 两层明暗的赛璐璐平涂, 深褐色线稿, 外轮廓线明显粗于内部线条, 线条粗细均匀, 色块干净平整, 明亮通透的配色, 轮廓清晰, 略带俯视的3/4视角, 手游品质, 远景全身构图, 主体完整入画, 从最高点到脚底全部在画面内, 主体只占画面高度的七成, 上下左右都留出明显空白, 背景是一整片干净的纯色, 主体的外轮廓线直接和背景相接
negative: 写实, 照片质感, 3D渲染, 厚涂, 复杂渐变, 金属镜面反光, 细密花纹, 蕾丝, 粉彩淡色, 浅色细线稿, 粗黑描边, 暗沉复古配色, 欧美卡通, 豆豆眼, 无五官, 像素风, 血腥, 文字, 水印, 签名, 多余肢体, 杂乱背景, 地面, 地台, 画面裁切, 主体贴边, 头顶出画, 脚部出画, 武器出画, 特写, 半身像
rules:
- 构图：主体必须完整入画，头顶、头饰、武器顶端、脚底、衣摆和飘带都不能碰到或超出画面边缘；主体整体占画面高度的七成左右（六成半到七成半之间），上下左右各留出至少一成的空白；镜头拉远，不要特写
- 头身比：所有角色统一为2.5头身，头的高度约占全身的四成；头大身小，手脚短圆，男女老少、高矮胖瘦都在这个比例里变化，不拉长成3头身，也不压扁成2头身以下
- 五官：所有角色用同一种画法，以标准风格图为准——大而圆的眼睛，深褐色瞳仁上深下浅，瞳仁里两个白色高光点（左上一个大的、右下一个小的），上眼线是一道粗的深褐色弧线；眉毛是简单的色块，男性粗、女性细；鼻子只点一个小点或一道短线；嘴是一道短弧线；脸颊可以有一小块淡淡的红晕。靠眉形、嘴形、胡须和皱纹区分性格与年纪，不靠改变眼睛的画法。不画眼白外露的小眼睛，不画豆豆眼
- '线条：全部用深褐色（接近 #3A2B2E）勾线，不用黑色，也不用浅色线、彩色线；外轮廓线粗（在1024像素的图上约6像素），内部结构线细一半（约3像素），同一类线粗细均匀；所有角色、所有部位线条颜色和粗细一致'
- 上色：赛璐璐平涂。每个色块只有亮面和暗面两层，暗面是同色相、略深一档的平涂色块，边界清楚；全身只在最亮的一两处加小块高光（眼睛、金属件）。金属、丝绸、皮革都用这同一种画法，只靠颜色区分材质，不画渐变、不画镜面反光、不画柔光晕染
- 细节量：以大色块为主。衣服上不画细密花纹、刺绣、蕾丝和成片的小甲片，纹样最多一处、用几笔简单的线示意；全身的小饰件不超过五处。唯一可以画得精细的是需求描述里点名的标志物（武将的兵器、舞姬的扇子），其余部分保持简洁
- 配色：高明度、中高饱和度，干净通透，所有角色饱和度在同一档；主色由需求描述指定，一个角色用一个主色加一到两个辅色；金色只做点缀；不用灰蒙蒙的粉彩淡色，也不用偏土偏灰的复古色调
- 视角：统一为略带俯视的3/4视角（俯角约30度），光源统一从左上方来
- 剪影：缩小到150像素高时仍能靠轮廓、主色和标志性道具认出来；标志性武器或发型可以适当夸张，但长兵器的长度不超过角色身高的1.2倍，且必须完整留在画面内
- 服饰：东汉三国时期的汉服形制，上衣交领右衽、宽袖或束袖，腰间系带；男子束发成髻，戴巾、帻或冠；铠甲是札甲，用三四道横线示意甲片即可；士兵裹头巾、穿短袍、打绑腿、穿布鞋或麻鞋。可以简化和夸张，但整体要一眼看出是中国古代
- 建筑参考东汉三国时期形制：夯土墙、木构架、瓦顶或茅草顶，可以简化和夸张
- 建筑与道具：和角色同一种线条和上色方式，结构简化成几个大块面，木、砖、瓦、金属的材质用颜色和少量纹理线区分
- 背景：一整片干净的纯色或透明；主体的外轮廓线直接和背景相接，主体之外不画任何东西
